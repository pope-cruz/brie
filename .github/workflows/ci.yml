name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  database:
    name: Migrations and database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      # Starts only Postgres and applies every migration from scratch.
      - run: supabase db start
      - run: supabase test db
      # Separate connections, interrupted writes, capacity and a disposable restore.
      # The harness replays migrations in its own databases; no reset of the stack.
      - run: python3 tests/reliability/run.py

  browser:
    name: Public and collaboration browser flows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: supabase start
      - name: Configure the local browser client
        run: |
          status=$(supabase status -o json)
          echo "VITE_SUPABASE_URL=$(jq -r '.API_URL' <<< "$status")" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$(jq -r '.ANON_KEY' <<< "$status")" >> "$GITHUB_ENV"
      - run: npm run test:e2e:public
      - run: npm run test:e2e:release
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
